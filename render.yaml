# Render Blueprint — half-fifty 3-tier 배포 (2026 금융 AI Challenge MVP)
# 배포 순서: agent → backend → frontend (URL을 다음 서비스 env에 주입)
services:
  - type: web
    name: halffifty-agent
    runtime: docker
    rootDir: agent
    plan: starter          # 콜드스타트 방지 (심사 기간 9/7~9/11 상시 접근 필수)
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # 대시보드에서 직접 입력
      - key: UPSTAGE_API_KEY
        sync: false        # OCR(사진·스캔 PDF) 필수 — 누락 시 /analyze-image 전면 비작동
      - key: GOOGLE_API_KEY
        sync: false        # 상담 녹취 전사(STT) 필수 — 누락 시 음성 업로드 전면 비작동 (텍스트 녹취는 무관)
      - key: MODEL_WORKER
        value: claude-haiku-4-5
      - key: MODEL_JUDGE
        value: claude-sonnet-4-6
      - key: LLM_CONCURRENCY
        value: "10"        # 조항 분석·페르소나 병렬 폭 (기본 5, 실측 90s→70s)
      # 운영 가드레일 (#174). 배포 URL은 심사 기간에 누구나 접근할 수 있다.
      # 분석 1건이 약 282원이라, 스크립트로 수천 건을 돌리면 크레딧이 말라
      # 심사위원 접속 시 서비스가 죽는다 — 결격 사유로 직결된다.
      - key: AGENT_SERVICE_TOKEN
        generateValue: true   # 백엔드와 같은 값을 넣을 것 (대시보드에서 복사)
      - key: ANALYZE_RATE_PER_MIN
        value: "6"            # 분석은 70~90초짜리라 정상 사용자는 넘길 일이 없다
      - key: DAILY_OUTPUT_TOKEN_BUDGET
        value: "400000"       # 일일 출력 토큰 상한. 0이면 무제한
      - key: CORS_ALLOWED_ORIGINS
        value: https://halffifty.onrender.com

  - type: web
    name: halffifty-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: AGENT_BASE_URL
        value: https://halffifty-agent.onrender.com
      # 에이전트와 **같은 값**이어야 한다 (#174). 다르면 모든 분석이 403이 된다.
      # generateValue를 쓰면 서로 다른 값이 생성되므로 대시보드에서 직접 복사할 것.
      - key: AGENT_SERVICE_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: https://halffifty.onrender.com
      # 로그인 세션 서명 키 (#102). 미주입 시 재시작마다 전원 로그아웃된다.
      - key: JWT_SECRET
        generateValue: true
      # 계정·기록 보관용 DB. 미주입이면 인메모리 H2로 뜨므로 기능은 동작하되
      # 재시작 시 계정이 사라진다 — 심사 기간 전 반드시 Postgres를 붙일 것.
      # 주의: Render가 주는 connectionString은 postgres:// 형식이라 Spring이
      # 그대로 읽지 못한다. jdbc:postgresql://HOST:PORT/DB 로 바꿔 넣는다.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: halffifty
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://halffifty-backend.onrender.com
      # PDF 포함 모든 요청이 백엔드 경유 (자문 §7) — 프론트는 에이전트 주소 불필요
