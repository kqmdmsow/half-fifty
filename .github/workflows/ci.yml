# CI (#64) — 세 서비스 병렬 검증. LLM API 호출 없이 전부 모킹된 테스트만 돈다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
        env:
          # 키는 전부 지연 초기화라 테스트에선 호출되지 않는다 — import 안전용 더미
          ANTHROPIC_API_KEY: dummy-for-ci
          UPSTAGE_API_KEY: dummy-for-ci

  backend:
    name: backend (gradle build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
