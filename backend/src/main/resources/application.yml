server:
  port: ${PORT:8080}

spring:
  # DB: 기본은 파일 없는 H2(로컬·테스트), 배포는 SPRING_DATASOURCE_URL로 Postgres 주입.
  # 저장 대상은 계정(이메일+인증해시)과 **복호화 불가능한 암호문**뿐이다 — 계약
  # 내용·분석 결과는 서버가 평문으로 갖지 않는다(#102 영지식 설계).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:halffifty;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    async:
      # 스트리밍(analyze-stream)은 judge 재시도 포함 시 수 분까지 걸린다 —
      # 기본 30초면 AsyncRequestTimeoutException으로 judge 이벤트 전에 끊긴다.
      request-timeout: 600000
  servlet:
    multipart:
      # 녹취(최대 25MB, #175)가 계약서(10MB)보다 크므로 서블릿 한도를 그에 맞춘다.
      # 파일 종류별 실제 상한은 컨트롤러가 따로 검사한다 — 서블릿 한도는 그물이지
      # 정책이 아니다(PDF는 여기서 25MB를 통과해도 컨트롤러가 10MB로 거른다).
      max-file-size: 25MB
      # 대조 검증은 계약서 + 녹취 두 파일을 함께 받는다 (10 + 25 + 여유).
      max-request-size: 40MB

# Python 에이전트 서비스 주소 (배포 시 AGENT_BASE_URL 환경변수로 주입)
agent:
  # 에이전트 서비스 토큰 (#174) — 미설정이면 헤더를 붙이지 않고,
  # 에이전트도 검사하지 않는다 (로컬 개발 호환).
  service-token: ${AGENT_SERVICE_TOKEN:}
  base-url: ${AGENT_BASE_URL:http://localhost:8000}

# 프론트 오리진 (배포 시 CORS_ALLOWED_ORIGIN 환경변수로 주입)
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# 로그인 토큰 서명 키 (#102). 미주입 시 부팅마다 랜덤 — 개발 편의용이며
# 배포에서는 반드시 JWT_SECRET을 주입해야 재시작 후에도 세션이 유지된다.
auth:
  jwt-secret: ${JWT_SECRET:}
  token-days: 30
